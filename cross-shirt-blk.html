<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CROSS SHIRT BLK | camouflage®</title>
  <style>
    body {
      background: #ff0000;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #000;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 32px;
    }
    .logo {
      text-align: center;
      font-size: 2.2rem;
      font-weight: bold;
      margin-top: 24px;
      letter-spacing: 1px;
      color: #000;
    }
    .logo sup {
      font-size: 1rem;
      vertical-align: super;
    }
    .divider {
      border: none;
      border-top: 3px solid #000;
      margin: 12px 0 24px 0;
      width: 90%;
    }
    .product-img {
      max-width: 220px;
      width: 90vw;
      height: auto;
      margin-bottom: 24px;
      margin-top: 16px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      display: block;
    }
    .product-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000;
      text-align: center;
      margin-top: 10px;
      text-decoration: underline;
    }
    .product-price {
      font-size: 1rem;
      text-align: center;
      margin-bottom: 32px;
      color: #000;
    }
    .buy-btn {
      display: block;
      margin: 0 auto;
      margin-top: 32px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .buy-btn:hover {
      color: #000;
      background: #fff;
      border-radius: 4px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">camouflage<sup>®</sup></div>
    <hr class="divider">
    <img src="Opera_senza_titolo 156.png" alt="Cross Shirt BLK" class="product-img">
    <div class="product-name">"CROSS SHIRT BLK"</div>
    <div class="product-price">20€</div>
    <a href="https://www.instagram.com/m/cam000uflage" class="buy-btn" target="_blank" rel="noopener noreferrer">BUY HERE</a>
  </div>

<!-- Modal Form -->
<div id="buyModal" style="display:none;position:fixed;z-index:1000;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;">
  <div style="background:#fff;padding:28px 18px 18px 18px;border-radius:10px;max-width:340px;width:90vw;box-shadow:0 2px 16px rgba(0,0,0,0.18);position:relative;">
    <button onclick="closeModal()" style="position:absolute;top:8px;right:12px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#888;">&times;</button>
    <form id="buyForm" action="https://formsubmit.co/camouflageskateboards@gmail.com" method="POST" style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-weight:bold;font-size:1.1rem;text-align:center;margin-bottom:8px;">Compila per acquistare</div>
      <input type="text" name="nome" placeholder="Nome" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
      <input type="tel" name="numero" placeholder="Numero di telefono" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
      <input type="email" name="email" placeholder="Email" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
      <select name="prodotto" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
        <option value="">Seleziona prodotto</option>
        <option>REAL TREE DECK</option>
        <option>CROSS SHIRT BLK</option>
        <option>CROSS SHIRT RED</option>
        <option>CAMO DOG</option>
      </select>
      <input type="hidden" name="_subject" value="Nuovo ordine dal sito camouflage®!">
      <input type="hidden" name="_captcha" value="false">
      <button type="submit" style="margin-top:8px;background:#000;color:#fff;border:none;padding:10px 0;border-radius:5px;font-size:1.1rem;font-weight:bold;cursor:pointer;">Invia</button>
    </form>
    <div id="formSuccess" style="display:none;text-align:center;font-weight:bold;font-size:1.1rem;color:green;margin-top:10px;">Richiesta inviata! Ti ricontatteremo presto.</div>
  </div>
</div>
<script>
// Modal logic
const modal = document.getElementById('buyModal');
const buyBtn = document.querySelector('.buy-btn');
buyBtn.addEventListener('click', function(e) {
  e.preventDefault();
  modal.style.display = 'flex';
});
function closeModal() {
  modal.style.display = 'none';
}
// Close modal on outside click
modal.addEventListener('click', function(e) {
  if (e.target === modal) closeModal();
});
</script>
</body>
</html>
