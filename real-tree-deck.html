<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REAL TREE DECK | camouflage®</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Itc+Wagner:wght@700&display=swap');
    @font-face {
      font-family: 'NT Wagner';
      src: url('ntwagner.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      background: #ff0000;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Arial, sans-serif;
      color: #000;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 48px;
    }
    .logo {
      text-align: center;
      font-size: 3.2rem;
      font-family: 'NT Wagner', Arial, sans-serif;
      font-weight: normal;
      margin-top: 32px;
      letter-spacing: 1.5px;
      color: #000;
    }
    .logo sup {
      font-size: 1.4rem;
      vertical-align: super;
    }
    .divider {
      border: none;
      border-top: 3px solid #000;
      margin: 12px 0 24px 0;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
    }
    .product-img {
      max-width: 350px;
      width: 95vw;
      height: auto;
      margin-bottom: 32px;
      margin-top: 24px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      display: block;
    }
    .product-name {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000;
      text-align: center;
      margin-top: 18px;
      text-decoration: underline;
    }
    .product-price {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 40px;
      color: #000;
    }
    .buy-btn {
      display: block;
      margin: 0 auto;
      margin-top: 40px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.7rem;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .buy-btn:hover {
      color: #000;
      background: #fff;
      border-radius: 4px;
      text-decoration: none;
    }
    #buyModal > div {
      max-width: 480px !important;
      width: 98vw !important;
      padding: 38px 24px 24px 24px !important;
    }
    #buyForm > * {
      font-size: 1.25rem !important;
    }
    #buyForm button[type="submit"] {
      font-size: 1.35rem !important;
      padding: 18px 0 !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="logo" style="text-decoration:none;color:inherit;">camouflage<sup>®</sup></a>
    <hr class="divider">
    <img src="camo deck.PNG" alt="Camo Deck" class="product-img">
    <div class="product-name">"REAL TREE DECK"</div>
    <div class="product-price">50€</div>
    <a href="https://www.instagram.com/m/cam000uflage" class="buy-btn" target="_blank" rel="noopener noreferrer">BUY HERE</a>
  </div>

<!-- Modal Form -->
<div id="buyModal" style="display:none;position:fixed;z-index:1000;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;">
  <div style="background:#fff;padding:28px 18px 18px 18px;border-radius:10px;max-width:340px;width:90vw;box-shadow:0 2px 16px rgba(0,0,0,0.18);position:relative;">
    <button onclick="closeModal()" style="position:absolute;top:8px;right:12px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#888;">&times;</button>
    <form id="buyForm" action="https://formsubmit.co/camouflageskateboards@gmail.com" method="POST" style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-weight:bold;font-size:1.1rem;text-align:center;margin-bottom:8px;">Compila per acquistare</div>
      <input type="text" name="nome" placeholder="Nome" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
      <input type="tel" name="numero" placeholder="Numero di telefono" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
      <input type="email" name="email" placeholder="Email" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;">
      <select name="prodotto" required style="padding:7px 8px;border-radius:5px;border:1px solid #aaa;font-size:1rem;background:#ff0000;color:#fff;font-weight:bold;">
        <option value="REAL TREE DECK">REAL TREE DECK</option>
      </select>
      <input type="hidden" name="_subject" value="Nuovo ordine dal sito camouflage®!">
      <input type="hidden" name="_captcha" value="false">
      <button type="submit" style="margin-top:8px;background:#ff0000;color:#fff;border:none;padding:12px 0;border-radius:5px;font-size:1.15rem;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.12);transition:background 0.2s;">Invia</button>
    </form>
    <div id="formSuccess" style="display:none;text-align:center;font-weight:bold;font-size:1.1rem;color:green;margin-top:10px;">Richiesta inviata! Ti ricontatteremo presto.</div>
  </div>
</div>
<script>
// Modal logic
const modal = document.getElementById('buyModal');
const buyBtn = document.querySelector('.buy-btn');
buyBtn.addEventListener('click', function(e) {
  e.preventDefault();
  modal.style.display = 'flex';
});
function closeModal() {
  modal.style.display = 'none';
}
// Close modal on outside click
modal.addEventListener('click', function(e) {
  if (e.target === modal) closeModal();
});
</script>
</body>
</html>
