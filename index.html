<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>camouflage® shop</title>
  <style>
    @font-face {
      font-family: 'NT Wagner';
      src: url('ntwagner.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'Arial Black', Arial, sans-serif;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 98vw;
      width: 100%;
      margin: 0 auto;
      /* border: 3px solid #000; */
      min-height: 100vh;
      background: #fff;
      box-sizing: border-box;
      padding: 0 2vw 32px 2vw;
    }
    @media (max-width: 700px) {
      .container {
        max-width: 100vw;
        padding: 0 1vw 32px 1vw;
      }
      .product img {
        max-width: 95vw;
        width: 95vw;
      }
      .logo {
        font-size: 2.2rem;
      }
      .title {
        font-size: 1.4rem;
      }
      .product-name, .product-price {
        font-size: 1.15rem;
      }
      .divider {
        width: 98%;
      }
    }
    .logo {
      text-align: center;
      font-size: 2.7rem;
      font-family: 'NT Wagner', Arial, sans-serif;
      font-weight: normal;
      margin-top: 24px;
      letter-spacing: 1px;
    }
    .logo sup {
      font-size: 1.2rem;
      vertical-align: super;
    }
    .divider {
      border: none;
      border-top: 2px solid #000;
      margin: 12px 0 24px 0;
      width: 95%;
    }
    .title {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .product {
      text-align: center;
      margin-bottom: 48px;
    }
    .product img {
      max-width: 340px;
      width: 100%;
      height: auto;
      margin-bottom: 14px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .product-name {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .product-price {
      font-size: 1.15rem;
      margin-bottom: 2px;
    }
    footer img {
      max-width: 180px;
      width: 80vw;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="logo" style="text-decoration:none;color:inherit;display:block;text-align:center;">camouflage<sup>®</sup></a>
    <hr class="divider">
    <div class="title">PRODUCTS</div>

    <div class="product">
      <a href="real-tree-deck.html" style="text-decoration:none;color:inherit;">
        <img src="camo deck.PNG" alt="Camo Deck">
        <div class="product-name">"REAL TREE DECK"</div>
        <div class="product-price">50€</div>
      </a>
    </div>

    <div class="product" style="opacity:0.55;pointer-events:none;">
      <div>
        <img src="camo dog.PNG" alt="Camo Dog" style="filter: grayscale(1);">
        <div class="product-name">"CAMO DOG"</div>
        <div class="product-price" style="color: red; font-weight: bold;">sold out</div>
      </div>
    </div>

  </div>
  <footer style="text-align:center; color:#888; font-size:0.9rem; padding:18px 0 8px 0; width:100vw; margin-left:calc(-50vw + 50%);">
    © camouflage®<br>
    <img src="camologo.PNG" alt="footer logo" style="width:100vw; max-width:none; margin-top:8px; display:block; margin-left:auto; margin-right:auto;">
  </footer>
</body>
</html>
